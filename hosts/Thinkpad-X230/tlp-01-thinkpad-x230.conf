# ThinkPad X230 / i5-3320M / Intel HD 4000 / SATA HDD

# ------------------------------------------------------------
# Profile mapping
# ------------------------------------------------------------

# Plugged in -> performance profile (_AC)
# Battery    -> balanced profile (_BAT)
# Power-saver remains available manually (_SAV)
TLP_AUTO_SWITCH=2
TLP_PROFILE_AC=PRF
TLP_PROFILE_BAT=BAL


# ------------------------------------------------------------
# CPU frequency scaling
# ------------------------------------------------------------

# schedutil can still reach maximum frequency under load.
# We use limits and EPB to distinguish the profiles.
CPU_SCALING_GOVERNOR_ON_AC=schedutil
CPU_SCALING_GOVERNOR_ON_BAT=schedutil
CPU_SCALING_GOVERNOR_ON_SAV=schedutil

# Ivy Bridge uses Intel EPB.
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power
CPU_ENERGY_PERF_POLICY_ON_SAV=power

# 0 means "do not impose a higher minimum".
# The hardware minimum will remain approximately 36% / 1.2 GHz.
CPU_MIN_PERF_ON_AC=0
CPU_MIN_PERF_ON_BAT=0
CPU_MIN_PERF_ON_SAV=0

# AC: full range
# BAT: daily-use power saving
# SAV: emergency runtime
CPU_MAX_PERF_ON_AC=100
CPU_MAX_PERF_ON_BAT=80
CPU_MAX_PERF_ON_SAV=60

# Turbo is useful on AC but expensive on battery.
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0
CPU_BOOST_ON_SAV=0


# ------------------------------------------------------------
# SATA mechanical disk
# ------------------------------------------------------------

# Better replaced with the stable ID shown by `tlp diskid`.
DISK_DEVICES="ata-Kingchuxing_256GB_2024041803288 ata-WDC_WD5000LPVX-22V0TT0_WD-WX51A64JAY3H"

# 254: performance / minimal disk-side power saving
# 128: TLP's compromise between saving and HDD wear
#                        SSD   HDD
DISK_APM_LEVEL_ON_AC="keep 254"
DISK_APM_LEVEL_ON_BAT="keep 192"
DISK_APM_LEVEL_ON_SAV="keep 128"

# Do not explicitly force the system disk to spin down.
#                        SSD  HDD
DISK_SPINDOWN_TIMEOUT_ON_AC="0 0"
DISK_SPINDOWN_TIMEOUT_ON_BAT="0 241"
DISK_SPINDOWN_TIMEOUT_ON_SAV="0 240"

# Safe and recommended SATA link power policy.
SATA_LINKPWR_ON_AC="med_power_with_dipm"
SATA_LINKPWR_ON_BAT="med_power_with_dipm"
SATA_LINKPWR_ON_SAV="med_power_with_dipm"

# Runtime suspend disks and SATA ports only on battery profiles.
AHCI_RUNTIME_PM_ON_AC=on
AHCI_RUNTIME_PM_ON_BAT=auto
AHCI_RUNTIME_PM_ON_SAV=auto
AHCI_RUNTIME_PM_TIMEOUT=15


# ------------------------------------------------------------
# PCIe devices
# ------------------------------------------------------------

RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto
RUNTIME_PM_ON_SAV=auto

# Respect firmware/kernel device compatibility decisions.
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=default
PCIE_ASPM_ON_SAV=default


# ------------------------------------------------------------
# Networking
# ------------------------------------------------------------

WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on
WIFI_PWR_ON_SAV=on

WOL_DISABLE=Y

# DEVICES_TO_DISABLE_ON_STARTUP="bluetooth"


# ------------------------------------------------------------
# Audio and USB
# ------------------------------------------------------------

SOUND_POWER_SAVE_ON_AC=1
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_ON_SAV=1
SOUND_POWER_SAVE_CONTROLLER=Y

USB_AUTOSUSPEND=1
USB_EXCLUDE_AUDIO=1


# ------------------------------------------------------------
# Optional battery longevity thresholds
# ------------------------------------------------------------

START_CHARGE_THRESH_BAT0=85
STOP_CHARGE_THRESH_BAT0=95
